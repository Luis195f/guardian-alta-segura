services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guardian_demo
      POSTGRES_USER: guardian_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_demo -d guardian_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - guardian_postgres_data:/var/lib/postgresql/data

volumes:
  guardian_postgres_data:
